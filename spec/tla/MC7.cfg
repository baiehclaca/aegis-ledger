\* n = 7, f = 2. MaxId stops at two blocks. A third block at this n does
\* not finish in a CI run (tens of millions of states and still growing).
\* Two blocks still cover a conflicting pair in one view and one
\* two-chain commit. The operators are the same as MC4.
CONSTANTS
  N = 7
  F = 2
  MaxView = 2
  MaxId = 2
  Byzantine = {0, 1}

SPECIFICATION Spec
INVARIANT Agreement
INVARIANT Chain
INVARIANT Validity
INVARIANT OneVote
CONSTRAINT StateConstraint
