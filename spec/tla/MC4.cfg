\* n = 4, f = 1. One Byzantine identity stands in for the faulty
\* replica. Two blocks per view is already the adversary's whole budget
\* at this size, so MaxId 4 covers two views of two blocks.
CONSTANTS
  N = 4
  F = 1
  MaxView = 2
  MaxId = 4
  Byzantine = {0}

SPECIFICATION Spec
INVARIANT Agreement
INVARIANT Chain
INVARIANT Validity
INVARIANT OneVote
CONSTRAINT StateConstraint
